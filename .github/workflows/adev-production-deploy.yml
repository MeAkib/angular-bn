name: Build adev and deploy to production

# Requires the FIREBASE_SERVICE_ACCOUNT secret (Firebase Hosting service account
# JSON for the angular-bn project). Until it is set, run this manually after
# creating the Firebase project.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BAZEL_REPO_CACHE_PATH: '~/.cache/bazel_repo_cache'

permissions: read-all

jobs:
  adev-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            startup --host_jvm_args=-Xmx2g
            build --discard_analysis_cache
            build --nokeep_state_after_build
            build --notrack_incremental_state
            build --worker_max_instances=1
            # Allow network access in sandbox for Algolia API calls during SSR prerendering.
            build --sandbox_default_allow_network
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: angular-bn
          channelId: live
